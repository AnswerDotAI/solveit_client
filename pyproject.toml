[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "solveit_client"
dynamic = ["version"]
description = ""
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Nathan Cooper", email = "nathanacooper@proton.me"}]
keywords = ['nbdev']
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = ["fastcore", "httpx"]

[project.urls]
Repository = "https://github.com/AnswerDotAI/solveit_client"
Documentation = "https://AnswerDotAI.github.io/solveit_client/"

[project.entry-points.nbdev]
solveit_client = "solveit_client._modidx:d"

[project.scripts]
sic = "solveit_client.cli:sic"
completion-sic = "solveit_client.cli:completion_sic"

[tool.setuptools.dynamic]
version = {attr = "solveit_client.__version__"}

[tool.setuptools.packages.find]
include = ["solveit_client"]

[tool.nbdev]
